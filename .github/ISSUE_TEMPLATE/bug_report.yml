name: Bug report
description: Report a reproducible bug
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Remove private assets or personal information before posting.

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: List the exact steps.
      placeholder: |
        1. Start PuruPet Desktop
        2. Open the compact chat or settings
        3. Click ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Desktop window or positioning
        - Codex / ChatGPT login
        - Conversation or work mode
        - Voice input or output
        - Avatar Studio
        - Avatar rendering
        - Face tracking
        - Mouth animation
        - OBS mode
        - Character setup
        - Documentation
        - Other
    validations:
      required: true

  - type: input
    id: browser
    attributes:
      label: PuruPet / Codex / browser version
      placeholder: PuruPet 0.1.0, Codex CLI 0.x, Chrome 126, etc.
    validations:
      required: false

  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: Windows 11, macOS, Ubuntu, etc.
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Console output or screenshots
      description: Remove API keys, login URLs, local paths, user names, and private character assets before posting.
    validations:
      required: false
